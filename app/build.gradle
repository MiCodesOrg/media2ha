plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'fr.micodes.media2ha'
    compileSdk 34

    def envCode = System.getenv("VERSION_CODE")
    def envName = System.getenv("VERSION_NAME")
    def envKeystore = System.getenv("KEYSTORE_FILE")

    defaultConfig {
        applicationId "fr.micodes.media2ha"
        minSdk 23
        targetSdk 34
        // Version injected by the release pipeline; sensible defaults locally.
        versionCode(envCode ? envCode.toInteger() : 1)
        versionName(envName ?: "1.0")
    }

    signingConfigs {
        release {
            // CI decodes the keystore to app/release-keystore.jks and sets the env vars.
            // Left empty locally so unsigned builds keep working.
            if (envKeystore) {
                storeFile file(envKeystore)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            // Only sign when the pipeline provided a keystore.
            if (envKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "media2ha.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
}
